<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Unity WebGL Player | 3dAutoPilot</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    /* ★★★ 让浏览器帮我们 letterbox（黑边） */
    #unity-canvas { object-fit: contain; background:black; }
  </style>
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="960" height="540" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">3dAutoPilot</div>
    </div>
  </div>

<script>
  const container       = document.querySelector("#unity-container");
  const canvas          = document.querySelector("#unity-canvas");
  const loadingBar      = document.querySelector("#unity-loading-bar");
  const progressBarFull = document.querySelector("#unity-progress-bar-full");
  const fullscreenBtn   = document.querySelector("#unity-fullscreen-button");
  const warningBanner   = document.querySelector("#unity-warning");

  /* ---------- 统一弹窗 ---------- */
  function unityShowBanner(msg, type){
    const div = document.createElement('div');
    warningBanner.appendChild(div);
    div.innerHTML = msg;
    div.style = `background:${type==='error'?'red':'yellow'};padding:10px`;
    if(type!=='error') setTimeout(()=>div.remove(),5e3);
  }

  /* ---------- Unity 配置 ---------- */
  const buildUrl = "Build";
  const config = {
    dataUrl:        `${buildUrl}/webgl-built.data`,
    frameworkUrl:   `${buildUrl}/webgl-built.framework.js`,
    codeUrl:        `${buildUrl}/webgl-built.wasm`,
    streamingAssetsUrl: "StreamingAssets",
    companyName:    "DefaultCompany",
    productName:    "3dAutoPilot",
    productVersion: "0.1",
    showBanner:     unityShowBanner,

    /* ★★★ 关闭自动跟随 canvas 尺寸 */
    matchWebGLToCanvasSize: false,
    /* ★★★ 把高 DPI 也干成 1，避免偷偷放大分辨率 */
    devicePixelRatio: 1
  };

  /* ---------- 响应式：桌面或移动 ---------- */
  if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
    const meta = document.createElement('meta');
    meta.name = 'viewport';
    meta.content='width=device-width,height=device-height,initial-scale=1.0,user-scalable=no,shrink-to-fit=yes';
    document.head.appendChild(meta);
    container.className = canvas.className = "unity-mobile";
  }else{
    // 初始窗口大小
    Object.assign(canvas.style, {width:"960px",height:"540px"});
    canvas.width  = 960;
    canvas.height = 540;
  }

  loadingBar.style.display = "block";

  /* ---------- 加载 Unity ---------- */
  let unityInstance;      // ★★★ 留给全局用
  const script = document.createElement("script");
  script.src = `${buildUrl}/webgl-built.loader.js`;
  script.onload = () =>{
    createUnityInstance(canvas, config, p=>{
      progressBarFull.style.width = (100*p)+"%";
    }).then(u=>{
      unityInstance = u;
      loadingBar.style.display = "none";
      fullscreenBtn.onclick = ()=>u.SetFullscreen(1); // Unity 自带全屏
    }).catch(alert);
  };
  document.body.appendChild(script);

  /* ---------- 分辨率锁定逻辑 ---------- */
  const FS_W = 1920, FS_H = 1080;   // ★★★ 目标分辨率

  function forceCanvasSize(w,h){
    // 改内部缓冲
    unityInstance?.Module.setCanvasSize(w,h,true);
    // 改 DOM 尺寸
    canvas.style.width  = w+"px";
    canvas.style.height = h+"px";
  }

  document.addEventListener("fullscreenchange", ()=>{
    if(!unityInstance) return;
    if(document.fullscreenElement){
      forceCanvasSize(FS_W,FS_H);          // 进全屏锁 1080p
    }else{
      unityInstance.Module.resizeCanvas(); // 退出全屏回到自动匹配
    }
  });
</script>
</body>
</html>
