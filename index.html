<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | IntraNote 1.0</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    body {
      margin: 0;
      background: #000; /* 全局黑色背景 */
      color: white;
      font-family: sans-serif;
    }

    #unity-container.fullscreen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #unity-footer {
      text-align: center;
      margin-top: 10px;
    }

    #unity-build-title {
      font-size: 20px;
      margin-bottom: 8px;
    }

    #unity-webgl-logo {
      width: 100px;
      height: 30px;
      margin: 0 auto;
      background: url('TemplateData/unity-logo.png') center/contain no-repeat;
    }

    #unity-fullscreen-button {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <p style="text-align:center; color:white; margin-top: 10px;">
      Please remain patient and wait for about 30 seconds...
    </p>

    <div id="unity-warning"></div>

    <div id="unity-footer">      
    </div>
  </div>

  <script>
    const container       = document.querySelector("#unity-container");
    const canvas          = document.querySelector("#unity-canvas");
    const loadingBar      = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const fullscreenBtn   = document.querySelector("#unity-fullscreen-button");
    const warningBanner   = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function toggle() {
        warningBanner.style.display = warningBanner.children.length ? "block" : "none";
      }
      const div = document.createElement("div");
      div.innerHTML = msg;
      div.style = `background:${type==="error"?"red":"yellow"};padding:10px;`;
      warningBanner.appendChild(div);
      if (type !== "error") setTimeout(()=>{warningBanner.removeChild(div);toggle();},5000);
      toggle();
    }

    const buildUrl  = "Build";
    const loaderUrl = `${buildUrl}/webgl-built.loader.js`;
    const config    = {
      dataUrl:        `${buildUrl}/webgl-built.data`,
      frameworkUrl:   `${buildUrl}/webgl-built.framework.js`,
      codeUrl:        `${buildUrl}/webgl-built.wasm`,
      streamingAssetsUrl: "StreamingAssets",
      companyName:    "Carnegie Mellon University",
      productName:    "IntraNote 1.0",
      productVersion: "0.1",
      showBanner:     unityShowBanner,
      matchWebGLToCanvasSize: false
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta   = document.createElement("meta");
      meta.name    = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.head.appendChild(meta);

      container.className = "unity-mobile";
      canvas.className    = "unity-mobile";
    } else {
      canvas.style.width  = "1600px";
      canvas.style.height = "900px";
    }

    loadingBar.style.display = "block";

    function fitLetterbox() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const targetAspect = 16 / 9;
      let cw = w, ch = w / targetAspect;
      if (ch > h) {
        ch = h;
        cw = h * targetAspect;
      }
      canvas.style.width  = `${cw}px`;
      canvas.style.height = `${ch}px`;
    }

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(
        canvas, config,
        (progress) => progressBarFull.style.width = `${100 * progress}%`
      ).then((unityInstance) => {
        loadingBar.style.display = "none";

        if (unityInstance.SendMessage) {
          unityInstance.SendMessage("__Internal", "SetCanvasSize", "1920,1080");
        }

        // 全屏功能已隐藏，这里可以不绑定 fullscreenBtn

        document.addEventListener("fullscreenchange", () => {
          if (!document.fullscreenElement) {
            container.classList.remove("fullscreen");
            canvas.style.width  = "1600px";
            canvas.style.height = "900px";
          }
        });

        window.addEventListener("resize", () => {
          if (document.fullscreenElement) fitLetterbox();
        });
      }).catch(alert);
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
