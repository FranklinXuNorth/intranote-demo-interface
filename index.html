<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | IntraNote 1.0</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    /* ===== 通用 ===== */
    html,body{margin:0;padding:0;overflow:hidden}
    /* 让容器在全屏时占满视口，背景黑色形成黑边（letter‑box） */
    #unity-container.fullscreen{
      position:fixed;inset:0;background:#000;
      display:flex;align-items:center;justify-content:center;
    }
  </style>
</head>
<body>
  <!-- 统一的“基准分辨率”容器 (1920×1080) -->
  <div id="unity-container" class="unity-desktop" style="width:1920px;height:1080px;">
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">IntraNote&nbsp;1.0</div>
    </div>
  </div>

  <script>
    /* ========== 常量 ========== */
    const BASE_W = 1920;      // 内部渲染宽度
    const BASE_H = 1080;      // 内部渲染高度

    /* ========== DOM 变量 ========== */
    const container       = document.querySelector("#unity-container");
    const canvas          = document.querySelector("#unity-canvas");
    const loadingBar      = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const fullscreenBtn   = document.querySelector("#unity-fullscreen-button");
    const warningBanner   = document.querySelector("#unity-warning");

    /* ========== 警告条 ========== */
    function unityShowBanner(msg, type) {
      function toggle() {warningBanner.style.display = warningBanner.children.length?"block":"none";}
      const div=document.createElement("div");
      div.innerHTML=msg;
      div.style=`background:${type==="error"?"red":"yellow"};padding:10px;`;
      warningBanner.appendChild(div);
      if(type!=="error")setTimeout(()=>{warningBanner.removeChild(div);toggle();},5000);
      toggle();
    }

    /* ========== Unity 配置 ========== */
    const buildUrl  = "Build";
    const loaderUrl = `${buildUrl}/webgl-built.loader.js`;
    const config    = {
      dataUrl:        `${buildUrl}/webgl-built.data`,
      frameworkUrl:   `${buildUrl}/webgl-built.framework.js`,
      codeUrl:        `${buildUrl}/webgl-built.wasm`,
      streamingAssetsUrl: "StreamingAssets",
      companyName:    "Carnegie Mellon University",
      productName:    "IntraNote 1.0",
      productVersion: "0.1",
      showBanner:     unityShowBanner,
      matchWebGLToCanvasSize:false           // 我们手动控制分辨率 & 输入映射
    };

    /* ========== 设备判定：移动端保持默认全屏 ========== */
    if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
      const meta=document.createElement("meta");
      meta.name="viewport";
      meta.content="width=device-width,height=device-height,initial-scale=1.0,user-scalable=no,shrink-to-fit=yes";
      document.head.appendChild(meta);
      container.className="unity-mobile";
      canvas.className="unity-mobile";
    }

    /* ========== Loading 进度 ========== */
    loadingBar.style.display="block";

    /* ========== 缩放函数（核心） ========== */
    function applyScale(){
      let scale;
      if(document.fullscreenElement){
        // 全屏：按窗口大小 letter‑box 等比放大到最大，不超过比例
        scale=Math.min(window.innerWidth/BASE_W,window.innerHeight/BASE_H);
      }else{
        // 非全屏：固定 50%（≈960×540）
        scale=0.5;
      }
      container.style.transform=`scale(${scale})`;
      container.style.transformOrigin=document.fullscreenElement?"center center":"top left";
    }

    /* ========== 加载 Unity 实例 ========== */
    const script=document.createElement("script");
    script.src=loaderUrl;
    script.onload=()=>{
      createUnityInstance(
        canvas,config,(progress)=>progressBarFull.style.width=`${100*progress}%`
      ).then((unityInstance)=>{
        loadingBar.style.display="none";

        /* 全屏按钮 —— 进入全屏并 letter‑box */
        fullscreenBtn.onclick=()=>{
          unityInstance.SetFullscreen(1);       // 触发浏览器全屏
          container.classList.add("fullscreen");
          applyScale();
        };

        /* 退出全屏时还原 */
        document.addEventListener("fullscreenchange",()=>{
          if(!document.fullscreenElement){
            container.classList.remove("fullscreen");
            applyScale();
          }
        });

        /* 任何尺寸变化都重新缩放 */
        window.addEventListener("resize",()=>{
          if(document.fullscreenElement) applyScale();
        });

        /* 初始缩放（桌面 0.5）*/
        applyScale();
      }).catch(alert);
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
