<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Unity WebGL Player | IntraNote</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <!-- ★ 让全屏时自动 letterbox，并配黑底 -->
  <style>
    #unity-canvas { object-fit: contain; background: #000; }
  </style>
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="960" height="540" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-webgl-logo"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">IntraNote</div>
    </div>
  </div>

  <!-- ★ 全屏提示遮罩 -->
  <div id="fullscreen-tip" style="
       position:fixed;inset:0;display:none;
       align-items:center;justify-content:center;flex-direction:column;
       z-index:999;background:rgba(0,0,0,.7);color:#fff;
       font-family:Arial, sans-serif;text-align:center;">
    <p style="margin:0 0 20px;font-size:20px;">
      Please use fullscreen mode<br>for better experience
    </p>
    <button id="tip-fullscreen-btn" style="
        padding:10px 25px;border:none;font-size:16px;cursor:pointer;">
      Go Fullscreen
    </button>
  </div>

<script>
  /* ---------- DOM refs ---------- */
  const container       = document.querySelector('#unity-container');
  const canvas          = document.querySelector('#unity-canvas');
  const loadingBar      = document.querySelector('#unity-loading-bar');
  const progressBarFull = document.querySelector('#unity-progress-bar-full');
  const fullscreenBtn   = document.querySelector('#unity-fullscreen-button');
  const warningBanner   = document.querySelector('#unity-warning');
  const fsTip           = document.getElementById('fullscreen-tip');
  const fsTipBtn        = document.getElementById('tip-fullscreen-btn');

  /* ---------- 弹窗 ---------- */
  function unityShowBanner(msg, type){
    const div = document.createElement('div');
    warningBanner.appendChild(div);
    div.innerHTML = msg;
    div.style = `background:${type==='error'?'red':'yellow'};padding:10px`;
    if (type!=='error') setTimeout(()=>div.remove(),5000);
  }

  /* ---------- Unity 配置 ---------- */
  const buildUrl = 'Build';
  const config = {
    dataUrl:              `${buildUrl}/webgl-built.data`,
    frameworkUrl:         `${buildUrl}/webgl-built.framework.js`,
    codeUrl:              `${buildUrl}/webgl-built.wasm`,
    streamingAssetsUrl:   'StreamingAssets',
    companyName:          'DefaultCompany',
    productName:          '3dAutoPilot',
    productVersion:       '0.1',
    showBanner:           unityShowBanner,
    matchWebGLToCanvasSize:false,  // 锁帧缓冲
    devicePixelRatio:     1        // 不让高 DPI 偷偷翻倍
  };

  /* ---------- 设备适配 ---------- */
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
    document.head.insertAdjacentHTML(
      'beforeend',
      `<meta name="viewport" content="width=device-width,height=device-height,initial-scale=1.0,user-scalable=no,shrink-to-fit=yes">`
    );
    container.className = canvas.className = 'unity-mobile';
  }else{
    Object.assign(canvas.style,{width:'960px',height:'540px'});
    canvas.width = 960; canvas.height = 540;
  }

  /* ---------- 加载 Unity ---------- */
  let unityInstance;
  loadingBar.style.display = 'block';

  const script = document.createElement('script');
  script.src   = `${buildUrl}/webgl-built.loader.js`;
  script.onload = () =>{
    createUnityInstance(canvas, config, p=>{
      progressBarFull.style.width = (100*p)+'%';
    }).then(u=>{
      unityInstance          = u;
      loadingBar.style.display = 'none';
      fullscreenBtn.onclick  = ()=>u.SetFullscreen(1);
      fsTipBtn.onclick       = ()=>u.SetFullscreen(1);
      fsTip.style.display    = 'flex';           // 显示提示
    }).catch(alert);
  };
  document.body.appendChild(script);

  /* ---------- 分辨率锁 1920×1080 ---------- */
  const FS_W = 1920, FS_H = 1080;

  function forceCanvasSize(w,h){
    unityInstance?.Module.setCanvasSize(w,h,true);
    canvas.style.width  = w+'px';
    canvas.style.height = h+'px';
  }

  document.addEventListener('fullscreenchange', ()=>{
    if (!unityInstance) return;
    if (document.fullscreenElement){
      fsTip.style.display = 'none';        // 进全屏关闭提示
      forceCanvasSize(FS_W,FS_H);
    }else{
      unityInstance.Module.resizeCanvas(); // 退出全屏回自动尺寸
      // 若想退出后再弹提示，取消下行注释
      // fsTip.style.display = 'flex';
    }
  });
</script>
</body>
</html>
