<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | IntraNote</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>

    <script>
      /* ----------  Service Worker ---------- */
      window.addEventListener("load", () => {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      /* ----------  DOM refs ---------- */
      const container       = document.querySelector("#unity-container");
      const canvas          = document.querySelector("#unity-canvas");
      const loadingBar      = document.querySelector("#unity-loading-bar");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const warningBanner   = document.querySelector("#unity-warning");

      /* ----------  Warn/Msg helper ---------- */
      function unityShowBanner(msg, type) {
        function toggle() {
          warningBanner.style.display =
            warningBanner.children.length ? "block" : "none";
        }
        const div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);

        if (type === "error") div.style = "background:red;padding:10px;";
        else {
          if (type === "warning") div.style = "background:yellow;padding:10px;";
          setTimeout(() => {
            warningBanner.removeChild(div);
            toggle();
          }, 5000);
        }
        toggle();
      }

      /* ----------  Unity build config ---------- */
      const buildUrl  = "Build";
      const loaderUrl = `${buildUrl}/webgl-built.loader.js`;

      const config = {
        dataUrl:        `${buildUrl}/webgl-built.data`,
        frameworkUrl:   `${buildUrl}/webgl-built.framework.js`,
        codeUrl:        `${buildUrl}/webgl-built.wasm`,
        streamingAssetsUrl: "StreamingAssets",
        companyName:    "Carnegie Mellon University",
        productName:    "IntraNote",
        productVersion: "0.1",
        showBanner:     unityShowBanner,
        matchWebGLToCanvasSize: false   // 🔑 关闭自动匹配
      };

      /* ----------  Mobile meta ---------- */
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        const meta = document.createElement("meta");
        meta.name    = "viewport";
        meta.content = [
          "width=device-width",
          "height=device-height",
          "initial-scale=1.0",
          "user-scalable=no",
          "shrink-to-fit=yes"
        ].join(", ");
        document.head.appendChild(meta);
      }

      /* ----------  Boot Unity ---------- */
      loadingBar.style.display = "block";

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, p => {
          progressBarFull.style.width = `${100 * p}%`;
        })
        .then(unity => {
          loadingBar.style.display = "none";

          /* ===== 🔒  Lock to 1920×1080 when fullscreen ===== */
          document.addEventListener("fullscreenchange", () => {
            if (document.fullscreenElement) {
              // 显示尺寸
              canvas.style.width  = "1920px";
              canvas.style.height = "1080px";
              // 渲染分辨率
              canvas.width  = 1920;
              canvas.height = 1080;

              // 如果 C# 那边需要同步，可发消息
              // unity.SendMessage("GameManager", "OnResolutionChange", "1920,1080");
            }
          });
        })
        .catch(alert);
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
